schema_version: "2.0"

component:
  type: application
  id: location
  product_name: GoreeCloud Location
  repository: GoreeCloud/location

lifecycle: forge
lifecycle_metadata:
  flags:
    - blocked
  deployment_state: development
  qualification_state: not-started
  next_gate: weave
  candidate_identity: null
  last_transition: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - docs/tracking.md
    - docs/privacy.md
    - docs/security.md
version: 0.0.0-forge.1

supported_platforms:
  - web
  - android
  - linux

api:
  versions:
    - v1
  endpoints:
    - name: location-api
      url: /api/v1
      purpose: Authenticated Location API for device enrollment, location ingestion, owner-scoped live/history access, preferences, deletion, and bounded Find My capability state.
    - name: process-health
      url: /healthz
      purpose: Bounded Development process health that does not disclose private location or dependency detail.
    - name: service-readiness
      url: /readyz
      purpose: Development readiness backed by required PostgreSQL connectivity and schema state.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/development-runtime.md
    notes: Location exposes Development health/readiness interfaces, but accepted Manager registration, lifecycle control, remediation, alerting, and operational-state publication remain incomplete.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/privacy.md
      - apps/web/src/timeline-screen-privacy.ts
    notes: Precise location is private by default and current source includes owner boundaries, deletion/export controls, and a presentation-only screen privacy mode, but producer-authoritative Privacy Shield retention, sharing, background-location, purpose, disclosure, and production privacy decisions remain incomplete.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/security.md
      - docs/authentication.md
    notes: Authentication, owner/device isolation, revocation, fail-closed recovery capability state, and sensitive logging boundaries exist in source, but accepted Wardveil runtime trust evidence, anti-abuse, anti-stalking, recovery-security, and production security acceptance remain incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - USER-MANUAL.md
    notes: Bounded owner-authorized Timeline export exists, but complete account export/import, encrypted backup, clean-environment restore, migration, rollback, preservation, and production Everkeep acceptance remain incomplete.
  glaze_ui:
    result: applicable-blocked
    version: "1.6.0"
    evidence:
      - apps/web/src/main.ts
      - apps/web/src/glaze-v1-6.ts
      - apps/web/src/glaze-v1-6.css
      - docs/GLAZE_UI_ADOPTION.md
    notes: Location now implements a repository-local GLAZE UI V1.6 / 1.6.0 presentation adapter against the current shared source/release authority without introducing a remote runtime dependency. Glaze remains blocked because Location-specific rendered, accessibility, adaptive, representative-device, performance, battery, rollback, and Human Visual Excellence acceptance is still required.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Cross-service boundaries are documented, but accepted Mesh capability publication, dependency discovery, event exchange, coordination, and evidence routing remain incomplete.
    capabilities: []
    dependencies:
      - goreecloud-identity
      - goreecloud-sync
      - goreecloud-policy
      - goreecloud-observability
      - privacy-shield
      - wardveil-security
      - everkeep
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/authentication.md
      - services/api/internal/identity
    notes: Development user/device credentials enforce owner and device boundaries, but production GoreeCloud Identity account, device, session, credential lifecycle, recovery, and runtime acceptance remain incomplete.
  policy:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/privacy.md
      - docs/security.md
    notes: Location collection, retention, sharing, geofencing, recovery, precision, and disclosure require governed decisions, but approved GoreeCloud Policy representation, evaluation, enforcement coordination, precedence, explanation, freshness, and policy evidence are not yet integrated.
  observability:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/development-runtime.md
    notes: Health/readiness provide bounded Development signals, but accepted GoreeCloud Observability metrics, structured events/logs, dependency health, correlation, freshness, diagnostics, collection-gap semantics, and operational evidence remain incomplete.

health:
  health_endpoint: /healthz
  readiness_endpoint: /readyz

continuity:
  backup:
    required: true
    requirements:
      - Protect owner-controlled location samples, device state, preferences, approved sharing state, and required service metadata through an accepted encrypted Everkeep backup contract.
      - Keep Sync replication distinct from backup truth and keep reusable credentials/secrets out of ordinary backup payloads.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration of Location state, ownership relations, PostGIS data, device/preference state, and required schema before Anchor qualification.
      - Verify restore does not resurrect deleted or expired state contrary to Privacy Shield policy and does not reactivate revoked credentials.
  export:
    required: true
    requirements:
      - Preserve documented owner-controlled portable export while maintaining formula hardening, authorization, and precise-location minimization.
      - Expand beyond the currently loaded bounded Timeline export only through separately accepted complete-account export semantics.
  portability:
    required: true
    requirements:
      - Preserve documented migration/import paths and open location formats without making a transitional service or third-party model the permanent source of truth.
      - Preserve source ownership, timestamps, coordinate precision, deletion, retention, and authorization semantics through migrations.

external_dependencies:
  - name: PostgreSQL with PostGIS
    purpose: Durable multi-user spatial storage for owner-scoped Location state and history.
    required: true
    version_constraint: ">=16"
  - name: MapLibre-compatible geographic provider
    purpose: Replaceable geographic presentation for approved Location map surfaces without making map tiles authoritative for stored location history.
    required: false
    version_constraint: null

compatibility:
  platform_contract: "2.0"
  glaze_ui_required: "1.6.0"
  requires:
    - goreecloud-platform-contract==2.0
    - glaze-ui==1.6.0
  provides:
    - location-api-v1
    - owner-scoped-location-history
    - device-location-ingestion
    - find-my-capability-state

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - docs/development-runtime.md
    - docs/authentication.md
    - docs/tracking.md
    - docs/security.md
    - docs/privacy.md
    - docs/GLAZE_UI_ADOPTION.md
  blockers:
    - The consolidated Timeline/privacy/Glaze candidate remains review-only until protected promotion completes; source CI does not make it authoritative main behavior.
    - GLAZE UI V1.6 / 1.6.0 source mapping is implemented, but fresh Location-specific rendered, accessibility, adaptive, representative-device, performance, battery, rollback, and Human Visual Excellence acceptance remains incomplete.
    - GoreeCloud Manager integration and acceptance remain incomplete.
    - Privacy Shield runtime retention, sharing, background-location, purpose/disclosure decisions, and production privacy acceptance remain incomplete.
    - Wardveil Security runtime trust evidence, anti-abuse, anti-stalking, recovery-security, and production acceptance remain incomplete.
    - Everkeep encrypted backup, clean-environment restore, complete export/import, migration, rollback, preservation, and recovery acceptance remain incomplete.
    - GoreeCloud Mesh capability/dependency/event contracts and runtime acceptance remain incomplete.
    - GoreeCloud Identity production account/device/session/credential lifecycle and runtime acceptance remain incomplete.
    - GoreeCloud Policy policy-decision, precedence, enforcement, and evidence integration remain incomplete.
    - GoreeCloud Observability metrics, structured diagnostics/events, dependency health, correlation, freshness, collection-gap semantics, and production operational evidence remain incomplete.
    - GoreeCloud Sync remains separately governed; its authorized dataset, change/version model, conflict reconciliation, replication/offline-resume, cross-device continuity, and runtime acceptance remain incomplete.
    - Android background collection, encrypted offline synchronization, representative-device validation, and battery/recovery behavior remain incomplete.
    - Sharing, geofencing, trips, places, production geographic-map delivery, and Find My recovery/anti-stalking acceptance remain incomplete.
    - Required deployment, recovery, rollback, release, and Anchor qualification evidence has not been produced.

# GoreeCloud Sync remains separately governed and is intentionally not represented
# as a tenth Integral Platform System.
