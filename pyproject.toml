[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-location"
version = "0.1.0"
description = "Privacy-first self-hosted location tracking foundation for GoreeCloud."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gclocation = "goreecloud_location.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
goreecloud_location = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
