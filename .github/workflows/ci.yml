name: location checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and tests
        run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Run API tests
        run: python -m pytest
      - name: Check web JavaScript syntax
        run: node --check src/goreecloud_location/static/app.js
