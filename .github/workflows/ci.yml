name: location checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.13'
      - name: Install package and tests
        run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Run API and loopback HTTP startup tests
        run: python -m pytest
      - name: Check web JavaScript syntax
        run: node --check src/goreecloud_location/static/app.js
