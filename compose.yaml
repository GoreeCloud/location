services:
  location:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - location-data:/data
    environment:
      XDG_DATA_HOME: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  location-data:
